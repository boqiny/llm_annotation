services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/annotagent.db
      - CORS_ORIGINS=["http://localhost","http://localhost:5173","http://localhost:8080"]
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-10}
      # Bundled seed data lives in the repo at annotagent/assets/data/ but
      # the backend Dockerfile build context is ./backend only — so we
      # bind-mount it in instead of baking it into the image, and point
      # SEED_DATA_DIR at the mount.
      - SEED_DATA_DIR=/app/assets/data
    volumes:
      - backend-data:/data
      - ./assets:/app/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
