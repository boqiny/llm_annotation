[project]
name = "annotation-demo"
version = "0.1.0"
description = "Demo system for annotation with reflective memory and prompt optimization"
requires-python = ">=3.10"

dependencies = [
    "openai",
    "anthropic",
    "python-dotenv",
    "pydantic",
    "rich",
    "typer",
    "jinja2",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["src"]